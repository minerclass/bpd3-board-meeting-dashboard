name: Update board meeting schedule

# Re-reads the district's public board meeting pages and commits any change to
# the schedule, agenda links, or minutes links. A commit to main triggers
# pages.yml, so the published dashboard follows automatically.
#
# When nothing on bpd3.org has changed the script exits without writing, so a
# quiet week produces no commits and no deploys.

on:
  schedule:
    # 11:17 UTC daily — early morning Central, and deliberately off the hour so
    # this does not pile onto the top-of-hour Actions queue.
    - cron: '17 11 * * *'
  # Lets the schedule be pulled in immediately after a district update.
  workflow_dispatch:

permissions:
  contents: write
  # Opening the reconciliation reminder issue.
  issues: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    name: Refresh from bpd3.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The script uses only the standard library, so there is nothing to install.
      - name: Refresh schedule
        run: python scripts/update_schedule.py

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html scripts/schedule.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/schedule.json
          git commit -m "Update board meeting schedule from bpd3.org"
          git push
          echo "### Schedule updated" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"

      # A card still summarized from its agenda, whose minutes have now been
      # posted, presents proposals as though they were the record. Open one
      # issue so the rewrite is not left to memory; later runs reuse it.
      - name: Flag cards needing reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Reconcile agenda-based cards against approved minutes
        run: |
          if [ ! -s reconcile-needed.md ]; then
            echo "Nothing awaiting reconciliation."
            exit 0
          fi
          {
            echo "### Minutes posted — reconciliation needed"
            cat reconcile-needed.md
          } >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing."
            gh issue edit "$existing" --body-file reconcile-needed.md
          else
            gh issue create --title "$TITLE" --body-file reconcile-needed.md
          fi
